<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: phone-first single column with bottom tabs; from 900px a navy side rail and two-column Today. Colour = duty type; red only for missing cover. */
:root{
  --rail:#0B1A2B; --rail-2:#16293F; --rail-fg:#D3DEEA; --rail-mute:#7F93A9;
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --line:#DDE3EA; --line-2:#C7D1DC;
  --fg:#0F1B2A; --mute:#5B6B7D; --faint:#8A99AA;
  --accent:#0E9384; --accent-soft:#E0F3F0; --accent-fg:#FFFFFF;
  --alert:#D92D20; --alert-soft:#FDECEA; --warn:#B54708; --warn-soft:#FEF0DC; --ok:#067647; --ok-soft:#E3F5EA;
  --weekend:#F5F0E6; --scrim:rgba(8,15,25,.45); --hero:#0B1A2B;
  --d-cons:#4F46E5; --d-cons-s:#ECEBFD; --d-tl:#B45309; --d-tl-s:#FDF1DD; --d-ot:#0E7C70; --d-ot-s:#DDF2EE;
  --d-wd:#0369A1; --d-wd-s:#E1F0FA; --d-ae:#BE185D; --d-ae-s:#FCE7F1; --d-mc:#7C3AED; --d-mc-s:#F1EAFE;
  --d-tr:#C2410C; --d-tr-s:#FDEBDF; --d-sb:#475569; --d-sb-s:#EAEEF3; --d-in:#4D7C0F; --d-in-s:#EEF6E0;
  --f-ui:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --rail:#060E18; --rail-2:#122337; --rail-fg:#D3DEEA; --rail-mute:#6E8298;
  --bg:#09111B; --surface:#111C29; --sunk:#0C1622; --line:#1F2D3D; --line-2:#2C3E52;
  --fg:#E8EEF5; --mute:#93A5B9; --faint:#64788E;
  --accent:#2BC4B2; --accent-soft:#0E2F2D; --accent-fg:#04201C;
  --alert:#F97066; --alert-soft:#3A1715; --warn:#FDB022; --warn-soft:#33240B; --ok:#47CD89; --ok-soft:#0E2A1C;
  --weekend:#151F2B; --scrim:rgba(0,0,0,.6); --hero:#123A4A;
  --d-cons:#A9A5FF; --d-cons-s:#1F1E47; --d-tl:#F5B759; --d-tl-s:#33250F; --d-ot:#3CCFBD; --d-ot-s:#0E2F2D;
  --d-wd:#6CC1F0; --d-wd-s:#0D2537; --d-ae:#F589B9; --d-ae-s:#3A1427; --d-mc:#C4A2FF; --d-mc-s:#271A44;
  --d-tr:#FB9A63; --d-tr-s:#381C0E; --d-sb:#AAB8C9; --d-sb-s:#1A2533; --d-in:#A9D46A; --d-in-s:#1D2A10;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --rail:#060E18; --rail-2:#122337; --rail-fg:#D3DEEA; --rail-mute:#6E8298;
  --bg:#09111B; --surface:#111C29; --sunk:#0C1622; --line:#1F2D3D; --line-2:#2C3E52;
  --fg:#E8EEF5; --mute:#93A5B9; --faint:#64788E;
  --accent:#2BC4B2; --accent-soft:#0E2F2D; --accent-fg:#04201C;
  --alert:#F97066; --alert-soft:#3A1715; --warn:#FDB022; --warn-soft:#33240B; --ok:#47CD89; --ok-soft:#0E2A1C;
  --weekend:#151F2B; --scrim:rgba(0,0,0,.6); --hero:#123A4A;
  --d-cons:#A9A5FF; --d-cons-s:#1F1E47; --d-tl:#F5B759; --d-tl-s:#33250F; --d-ot:#3CCFBD; --d-ot-s:#0E2F2D;
  --d-wd:#6CC1F0; --d-wd-s:#0D2537; --d-ae:#F589B9; --d-ae-s:#3A1427; --d-mc:#C4A2FF; --d-mc-s:#271A44;
  --d-tr:#FB9A63; --d-tr-s:#381C0E; --d-sb:#AAB8C9; --d-sb-s:#1A2533; --d-in:#A9D46A; --d-in-s:#1D2A10;
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none}

.app{min-height:100%}
.rail{display:none}
main{max-width:640px;margin:0 auto;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:12px 0 10px;display:flex;flex-direction:column;gap:10px}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
h1{font-size:23px;line-height:1.15;margin:1px 0 0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:13px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.demo{font:600 10.5px var(--f-mono);letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:3px 7px;white-space:nowrap}

/* Date strip */
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.strip::-webkit-scrollbar{display:none}
.day{scroll-snap-align:center;flex:0 0 46px;height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;padding:0}
.day small{font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.day b{font:600 17px var(--f-mono)}
.day.we{background:var(--weekend)}
.day.today small{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.day[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.day i{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day .mo{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--alert)}

.section{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}

/* Next duty hero */
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;border:0;text-align:left;width:100%}
.hero .eyebrow{color:var(--rail-mute)}
.hero .what{font-size:21px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.hero .when{font:600 14px var(--f-mono);color:var(--rail-fg)}
.hero .tag{background:rgba(255,255,255,.12);color:#fff}
.hero.empty{background:var(--surface);color:var(--fg);border:1px dashed var(--line-2)}
.hero.empty .eyebrow{color:var(--mute)}

/* Consultant tiles */
.cons-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:62px;text-align:left;width:100%}
.tile .ic{width:38px;height:38px;border-radius:11px;background:var(--d-cons-s);color:var(--d-cons);display:grid;place-items:center;flex:none}
.tile .ic svg{width:26px;height:26px}
.tile .ic,.mini,.firm header .ic{--hole:var(--d-cons-s)}
.tile.general .ic{--hole:var(--d-cons)}
.tile.off .ic{--hole:var(--sunk)}
.tile .tx{min-width:0;display:flex;flex-direction:column}
.tile .tx small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.tile .tx b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.general{grid-column:1/-1;border-color:var(--d-cons);background:var(--d-cons-s)}
.tile.general .ic{background:var(--d-cons);color:var(--surface)}
.tile.off{background:transparent;border-style:dashed}
.tile.off .ic{background:var(--sunk);color:var(--faint)}
.tile.off b{color:var(--faint);font-weight:500}
.tile.missing{border-color:var(--alert);background:var(--alert-soft)}
.tile.missing b{color:var(--alert)}

/* Duty rows */
.duty{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.duty:first-child{border-top:0;padding-top:2px}
.duty:last-child{padding-bottom:2px}
.tag{font:600 10.5px var(--f-mono);letter-spacing:.03em;border-radius:7px;padding:4px 0;width:44px;text-align:center;background:var(--c-s);color:var(--c);display:inline-block}
.duty .lbl{font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:6px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13.5px;line-height:1.2;min-height:36px}
.chip:active{transform:scale(.98)}
.chip .g{font:600 10px var(--f-mono);color:var(--mute);background:var(--sunk);border-radius:5px;padding:2px 5px}
.chip.me{border-color:var(--accent);background:var(--accent-soft)}
.chip.leave{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.chip.svc{border-style:dashed;color:var(--mute);font-weight:600}
.chip.unres{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.none{color:var(--faint);font-size:13.5px}
.pair{display:inline-flex;align-items:center;gap:6px}
.pair span{color:var(--faint)}

.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:14px;background:var(--warn-soft)}
.alert.bad{background:var(--alert-soft)}
.alert.ok{background:var(--ok-soft)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--warn)}
.alert.bad .dot{background:var(--alert)}.alert.ok .dot{background:var(--ok)}

/* Segmented control */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg button{flex:1 0 auto;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.selrow{display:flex;gap:8px;align-items:center}
select.pick{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:9px 12px;min-height:42px;font-weight:600;min-width:0;max-width:100%}

/* Rota day cards */
.daylist{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:150px}
.dcard.we{background:var(--weekend)}
.dcard.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dcard header{display:flex;justify-content:space-between;align-items:center}
.dcard header b{font-size:15.5px}
.dcard .r{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.consline{display:flex;flex-wrap:wrap;gap:6px}
.mini{display:inline-flex;align-items:center;gap:6px;border-radius:10px;background:var(--d-cons-s);padding:5px 9px 5px 6px;font-weight:700;font-size:13px;border:0;color:var(--fg);min-height:34px}
.mini svg{width:20px;height:20px;color:var(--d-cons)}
.mini.gen{outline:1.5px solid var(--d-cons)}
.badge{font:600 10.5px var(--f-mono);border-radius:99px;padding:3px 8px;background:var(--c-s,var(--accent-soft));color:var(--c,var(--accent));white-space:nowrap}

/* PDF-style grid (coordinator view) */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-height:70vh}
table.rota{border-collapse:separate;border-spacing:0;font-size:12.5px}
.rota th,.rota td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.rota thead th{position:sticky;background:var(--surface);z-index:2;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.rota thead tr:first-child th{top:0}
.rota thead tr:nth-child(2) th{top:28px}
.rota th.grp{color:var(--c);background:var(--c-s)}
.rota .d{position:sticky;left:0;background:var(--surface);z-index:1;font-family:var(--f-mono);text-align:left}
.rota thead th.d{z-index:3}
.rota tr.we td{background:var(--weekend)}
.rota tr.today td{box-shadow:inset 0 2px 0 var(--accent)}
.rota td.n{font-weight:600}
.rota td.gap{background:var(--alert-soft)!important;color:var(--alert);font-weight:700}
.rota td.lv{box-shadow:inset 0 0 0 1.5px var(--warn)}
.rota .gs{border-left:2px solid var(--line-2)}

/* Agenda */
.agenda{display:flex;flex-direction:column;gap:16px}
.wk{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:11px 12px;text-align:left;width:100%;color:var(--fg)}
.item .when{font-family:var(--f-mono);font-size:12px;color:var(--mute);line-height:1.2;text-align:center}
.item .when b{display:block;color:var(--fg);font-size:19px}
.item .what b{display:block;font-size:15px}
.item .what small{color:var(--mute);font-size:12.5px}
.item.next{box-shadow:0 0 0 2px var(--accent)}
.item.past{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;color:var(--fg);width:100%}
button.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.stat b{font:600 22px var(--f-mono);display:block}
.stat span{font-size:12px;color:var(--mute);line-height:1.25;display:block}

/* Steps tracker */
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);flex-wrap:wrap}
.steps span{display:inline-flex;align-items:center;gap:5px}
.steps i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);display:inline-block}
.steps .done i{background:var(--accent);border-color:var(--accent)}
.steps .cur{color:var(--fg);font-weight:700}
.steps .cur i{border-color:var(--accent)}

/* Team */
.search{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:11px 14px;min-height:44px}
.firm{display:flex;flex-direction:column;gap:8px}
.firm header{display:flex;align-items:center;gap:10px}
.firm header .ic{width:34px;height:34px;border-radius:10px;background:var(--d-cons-s);color:var(--d-cons);display:grid;place-items:center}
.firm header .ic svg{width:20px;height:20px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.bars{display:flex;gap:2px;height:7px;border-radius:4px;overflow:hidden;background:var(--sunk);width:90px;flex:none}
.bars i{display:block;height:100%}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:22px 22px 0 0;max-height:84vh;overflow:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);max-width:640px;margin:0 auto}
.sheet .handle{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:4px auto 12px}
.sheet h3{font-size:21px;margin:0}
.sheet .sub{color:var(--mute);font-size:13.5px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.block{width:100%}
.list{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);width:100%;text-align:left;min-height:48px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:12.5px;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;min-height:36px}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.wrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 28px 40px;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;text-align:left;color:var(--fg)}
.wrow:first-child{border-top:0}
.wn{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;min-width:0}
.wn b{font-size:14px}
.wn small{width:100%;color:var(--warn);font-size:11.5px;font-weight:600}
.wn .g{font:600 10px var(--f-mono);color:var(--mute);background:var(--sunk);border-radius:5px;padding:2px 5px}
.wbar{position:relative;height:10px;border-radius:5px;background:var(--sunk)}
.wbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.wbar i.hi,.wbar i.lo{background:var(--warn)}
.wbar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55;border-radius:1px}
.wv{text-align:right;font-weight:700;font-size:15px}
.wd{text-align:right;font-size:12px;color:var(--mute)}
.wd.hi,.wd.lo{color:var(--warn);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--mute);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px;font:inherit;color:var(--fg);width:100%}
.sheet .pin{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:12px 0 calc(20px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-20px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}

/* Tabs */

function duties(i){

// Apply an approved request to the in-memory rota (the live app does this in the database).
function applyReq(r){

  const kIdx={cons:[0,1,2,3,4,5,6],tl:[7],ot:[8,9],wards:[10],ae:[11,12,13,14],interns:[15]};
  if(kIdx[r.k]){for(const c of kIdx[r.k])if(canon(x.oc[c])===r.from)x.oc[c]=r.to;return}
  if(r.k==='mcj'&&canon(x.mo[0])===r.from)x.mo[0]=r.to;
  if(r.k==='mcs'&&canon(x.mo[1])===r.from)x.mo[1]=r.to;
  if(r.k==='tr')x.mo[2]=x.mo[2].map(n=>canon(n)===r.from?r.to:n);
  if(r.k==='sb')x.mo[3]=x.mo[3].map(n=>canon(n)===r.from?r.to:n);
}
// ---------- rule checks (same rules as the database) ----------
function checks(){
  const gap=[],leave=[],unres=[],grade=[];
  days.forEach(x=>{const oc=x.oc,[j,s,t,sb]=x.mo;
    if(!oc[0])gap.push({i:x.i,what:'General consultant',bad:true});
    if(!oc[7])gap.push({i:x.i,what:'Team Leader',bad:true});
    if(!oc[8]&&!oc[9])gap.push({i:x.i,what:'Operation Theatre'});
    if(!oc[10])gap.push({i:x.i,what:'Wards'});
    const ae=oc.slice(11,15).filter(Boolean);
    if(ae.length<3)gap.push({i:x.i,what:'A&E below 3 doctors',bad:true});
    if(ae.filter(n=>STAFF[canon(n)]?.g==='senior').length<2)grade.push({i:x.i,what:'A&E has fewer than 2 seniors'});
    if(x.dow<=4){if(!j)gap.push({i:x.i,what:'Junior morning call'});if(!s)gap.push({i:x.i,what:'Senior morning call'})}
    if((x.dow===0||x.dow===3)&&t.length<2)gap.push({i:x.i,what:'Trauma O.T. pair'});
    duties(x.i).forEach(d=>{if(d.n==='ROTATOR')unres.push({i:x.i,k:d.k});else if(isPerson(d.n)&&leaveOf(d.n,x.d).length)leave.push({i:x.i,n:canon(d.n),k:d.k,l:leaveOf(d.n,x.d)[0]})});
  });
  return {gap,leave,unres,grade};
}

function nameMatches(q){

// Workload overview for coordinators: compare doctors within a grade group, for one duty type and period.
const METRICS=[
  ['oc','All on-calls',d=>d.rota==='oc'],['we','Fri / Sat on-calls',d=>d.rota==='oc'&&days[d.i].we],
  ['tl','Team Leader',d=>d.k==='tl'],['ot','OT',d=>d.k==='ot'],['ae','A&E',d=>d.k==='ae'],['wards','Wards',d=>d.k==='wards'],
  ['mo','All morning duties',d=>d.rota==='mo'],['mc','Morning call',d=>d.k==='mcj'||d.k==='mcs'],['tr','Trauma O.T.',d=>d.k==='tr'],['sb','Standby',d=>d.k==='sb'],
  ['cons','Consultant on-call days',d=>d.k==='cons']];
const GROUPS=[['senior','Seniors',['senior','transitional']],['junior','Juniors',['junior']],['rotator','Rotators',['rotator']],['intern','Interns',['intern']],['consultant','Consultants',['consultant']]];
function inPeriod(d){return state.wMonth==='all'||days[d.i].d.startsWith(state.wMonth)}
function leaveDaysIn(n){
  let c=0;days.forEach(x=>{if((state.wMonth==='all'||x.d.startsWith(state.wMonth))&&leaveOf(n,x.d).length)c++});return c;
}
function adminWorkload(){
  const G=GROUPS.find(g=>g[0]===state.wGroup)||GROUPS[0];
  let M=METRICS.find(m=>m[0]===state.wMetric)||METRICS[0];
  if(G[0]==='consultant'&&M[0]!=='cons'&&M[0]!=='we'&&M[0]!=='oc'){M=METRICS.find(m=>m[0]==='cons')}
  const metricsFor=G[0]==='consultant'?METRICS.filter(m=>['cons','we'].includes(m[0])):METRICS.filter(m=>m[0]!=='cons');
  const ppl=DEMO.staff.filter(s=>s.status!=='inactive'&&G[2].includes(s.g));
  let rows=ppl.map(s=>{const all=myDuties(s.n).filter(inPeriod);return {n:s.n,g:s.g,v:all.filter(M[2]).length,total:all.length,leave:leaveDaysIn(s.n)}});
  const mean=rows.length?rows.reduce((a,r)=>a+r.v,0)/rows.length:0;
  const max=Math.max(1,...rows.map(r=>r.v));
  rows.sort((a,b)=>state.wSort==='asc'?a.v-b.v||a.n.localeCompare(b.n):state.wSort==='name'?a.n.localeCompare(b.n):b.v-a.v||a.n.localeCompare(b.n));
  const months=[...new Set(days.map(d=>d.d.slice(0,7)))];
  const chipRow=(items,key,cur)=>`<div class="chips">${items.map(([k,l])=>`<button class="fchip" aria-pressed="${cur===k}" data-w="${key}:${k}">${l}</button>`).join('')}</div>`;
  const hi=rows.filter(r=>r.v-mean>=1.5).length,lo=rows.filter(r=>mean-r.v>=1.5).length;
  const period=state.wMonth==='all'?'all loaded months':`${MONL[+state.wMonth.slice(5)-1]} ${state.wMonth.slice(0,4)}`;
  return `<p class="note" style="margin-top:0">Coordinators only. Compare doctors in the same grade for one type of duty. Fair share = the group average.</p>
  <div class="section" style="margin-top:6px;gap:8px">
    ${chipRow(GROUPS.map(g=>[g[0],g[1]]),'group',G[0])}
    ${chipRow(metricsFor.map(m=>[m[0],m[1]]),'metric',M[0])}
    ${chipRow([...(months.length>1?[['all','All months']]:[]),...months.map(m=>[m,`${MON[+m.slice(5)-1]} ${m.slice(0,4)}`])],'month',state.wMonth)}
  </div>
  <div class="stats" style="margin-top:12px"><div class="stat"><b>${mean.toFixed(1)}</b><span>Fair share · ${esc(M[1])}</span></div><div class="stat" style="${hi?'border-color:var(--warn)':''}"><b>${hi}</b><span>Well above (+1.5 or more)</span></div><div class="stat" style="${lo?'border-color:var(--warn)':''}"><b>${lo}</b><span>Well below (−1.5 or more)</span></div></div>
  <div class="section"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>${G[1]} · ${rows.length} · ${period}</h2>

async function drawPages(box){

  if(!f){toast('Choose the PDF file.',true);return}
  const u=new Uint8Array(await f.arrayBuffer());
  if(String.fromCharCode(...u.subarray(0,5))!=='%PDF-'){toast('That file is not a PDF.',true);return}
  if(u.length>20*1048576){toast('The PDF is larger than 20 MB.',true);return}
  btn.disabled=true;btn.textContent='Uploading…';
  try{
    const data=bytesToB64(u),local=await sha256(u);
    const r=await apiPost({action:'uploadDoc',pw:sess('orthoPw'),id,version:ver,filename:f.name,data});
    if(r.sha256!==local)throw new Error('The stored file does not match the one you chose. Please upload again.');
    try{localStorage.setItem('orthoLive.doc.'+id,JSON.stringify({sha256:r.sha256,data}))}catch(e){}
    await reloadData(`Uploaded: ${esc(ver)}. Everyone now sees this version.`);
  }catch(e){toast(esc(e.message),true);btn.disabled=false;btn.textContent='Upload'}
}

function leavesHtml(month){
  const first=`${month}-01`,last=`${month}-${String(new Date(Date.UTC(+month.slice(0,4),+month.slice(5),0)).getUTCDate()).padStart(2,'0')}`;
  const inMonth=DEMO.leave.filter(l=>l.s<=last&&l.e>=first);
  const ms=days.filter(d=>d.d.startsWith(month));
  if(!state.lvDate||!state.lvDate.startsWith(month))state.lvDate=(TODAY.startsWith(month)?TODAY:ms[0]?.d)||first;
  const dd=x=>`${+x.slice(8)} ${MON[+x.slice(5,7)-1]}`;
  const onDay=inMonth.filter(l=>l.s<=state.lvDate&&state.lvDate<=l.e);
  const people={};inMonth.forEach(l=>{(people[l.n]=people[l.n]||[]).push(l)});
  const dayCount=n=>ms.filter(x=>people[n].some(l=>l.s<=x.d&&x.d<=l.e)).length;
  const grp=n=>{const g=STAFF[n]?.g;return g==='consultant'?'Consultants':g?'Residents and others':'Not on the Staff tab'};
  const groups=['Consultants','Residents and others','Not on the Staff tab'].map(g=>[g,Object.keys(people).filter(n=>grp(n)===g).sort((a,b)=>Math.min(...people[a].map(l=>+(l.s<first?first:l.s).slice(8)))-Math.min(...people[b].map(l=>+(l.s<first?first:l.s).slice(8)))||a.localeCompare(b))]).filter(g=>g[1].length);
  const chipOf=n=>STAFF[n]?`<button class="chip${n===state.me?' me':''}" data-person="${esc(n)}">${esc(n)}</button>`:`<span class="chip">${esc(n)}</span>`;
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>On leave on</b>
        <select class="pick" id="lvdate" aria-label="Date">${ms.map(x=>`<option value="${x.d}"${x.d===state.lvDate?' selected':''}>${fmt(x.i)}${x.d===TODAY?' · today':''}</option>`).join('')}</select></div>
      <div class="people">${onDay.length?onDay.map(l=>chipOf(l.n)).join(''):'<span class="none">Nobody is on leave that day.</span>'}</div></div>
    ${groups.length?groups.map(([g,ns])=>`<div class="section"><h2>${g} · ${ns.length}</h2><div class="tablewrap"><table class="rota lvt"><thead><tr><th class="d">Name</th><th>Dates</th><th>Days in ${MON[+month.slice(5)-1]}</th></tr></thead><tbody>
      ${ns.map(n=>`<tr class="${people[n].some(l=>l.s<=state.lvDate&&state.lvDate<=l.e)?'today':''}"><td class="d">${chipOf(n)}</td><td class="n" style="text-align:left">${people[n].map(l=>l.s===l.e?dd(l.s):`${dd(l.s)} – ${dd(l.e)}`).join(', ')}</td><td class="n mono">${dayCount(n)}</td></tr>`).join('')}</tbody></table></div></div>`).join('')
      :`<p class="none">No leave written under the ${MONL[+month.slice(5)-1]} on-call table.</p>`}
    <p class="note">From the leave lines under the on-call table in the Google Sheet. Approved leave requests are added there automatically. The type of leave is not shown.</p>`;
}

// ---------- DPP inside the app (text exactly as printed; the PDF stays the reference) ----------
const dppNorm=t=>t.toLowerCase().replace(/[НО]/g,c=>({Н:'h',О:'o'})[c]).replace(/[С]/g,'c').replace(/[М]/g,'m');
function dppMark(text,toks){let h=esc(text);toks.forEach(t=>{const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');h=h.replace(re,'<mark>$1</mark>')});return h}
function dppTextView(){
  const meta=(DEMO.docs||{}).dpp,stale=!!(meta&&meta.sha256&&meta.sha256!==DPP_SOURCE.sha256);
  const head=`<div class="card doccard"><div class="eyebrow">Official document · current version</div>
    <h2 style="margin:2px 0 4px;font-size:20px;text-transform:none;letter-spacing:0;color:var(--fg)">${esc(meta?meta.version:DPP_SOURCE.version)}</h2>
    <b>${esc(DPP_TEXT.title)}</b>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="btn primary" data-restab="dpdf">View original PDF</button><button class="btn" data-dppdl ${meta?'':'disabled'}>Download</button></div>
    ${meta?'':'<span class="small">The original PDF has not been uploaded yet. A coordinator can upload it under View original PDF.</span>'}</div>`;
  if(stale)return `${head}<div class="alert bad" style="margin-top:10px"><span class="dot"></span><div><b>A newer DPP has been uploaded (${esc(meta.version)}).</b> The in-app text was copied from the ${esc(DPP_SOURCE.version)} version, so it is hidden to stop anyone relying on old wording. Use <b>View original PDF</b>. Ask the app maintainer to copy the new version into the app.</div></div>`;
  const toks=(state.dq||'').trim().toLowerCase().split(/\s+/).filter(t=>t.length>1);
  const secs=DPP_TEXT.sections.map((sec,si)=>{
    if(!toks.length)return {sec,si,show:sec.lines.map((l,i)=>i)};
    const hit=new Set();
    sec.lines.forEach((l,i)=>{const one=dppNorm(l.t),two=one+' '+dppNorm(sec.lines[i+1]?.t||'');
      if(toks.every(t=>one.includes(t)))hit.add(i);else if(toks.every(t=>two.includes(t))&&toks.some(t=>one.includes(t))){hit.add(i);hit.add(i+1)}});
    if(toks.every(t=>dppNorm(sec.title).includes(t)))sec.lines.forEach((l,i)=>hit.add(i));
    const show=[...hit].sort((a,b)=>a-b);
    // keep the sub-heading above each matching line
    const withHead=new Set(show);show.forEach(i=>{for(let j=i;j>=0;j--)if(sec.lines[j].h){withHead.add(j);break}});
    return {sec,si,show:[...withHead].sort((a,b)=>a-b),n:show.length};
  }).filter(x=>x.show.length);
  const line=(l,mark)=>l.h?`<div class="dpph">${mark?dppMark(l.t,toks):esc(l.t)}</div>`:`<div class="dppl">${mark?dppMark(l.t,toks):esc(l.t)}</div>`;
  const body=toks.length?(secs.length?secs.map(x=>`<div class="section"><h2>${dppMark(x.sec.title,toks)} <span class="note" style="text-transform:none;letter-spacing:0">· page ${x.sec.page}</span></h2><div class="card dppcard">${x.show.map(i=>line(x.sec.lines[i],true)).join('')}</div></div>`).join('')
      :`<div class="card"><b>“${esc(state.dq)}” is not in the DPP text.</b><p class="note" style="margin:6px 0 0">Try other words, or open the original PDF.</p></div>`)
    :DPP_TEXT.sections.map((sec,si)=>`<details class="dppsec"${/TRAUMA/.test(sec.title)?' open':''}><summary><b>${esc(sec.title)}</b><span class="note">page ${sec.page}</span></summary><div class="dppcard">${sec.lines.map(l=>line(l,false)).join('')}</div></details>`).join('');
  return `${head}
  <div class="section" style="margin-top:12px;gap:8px"><input class="search" id="dq" type="search" placeholder="Search the DPP, e.g. cellulitis, hand, fracture" value="${esc(state.dq||'')}" autocomplete="off" aria-label="Search the DPP">
    ${toks.length?`<span class="note">${secs.reduce((a,x)=>a+x.n,0)} matching line${secs.reduce((a,x)=>a+x.n,0)===1?'':'s'} in ${secs.length} specialt${secs.length===1?'y':'ies'}</span>`:`<span class="note">${DPP_TEXT.sections.length} specialties. Tap one to open it.</span>`}</div>
  <div id="dppres">${body}</div>
  <div class="card" style="margin-top:12px;display:flex;flex-direction:column;gap:8px"><b>${esc(DPP_TEXT.chart.title)}</b><span class="note">This flow chart is a picture in the DPP, so it is not copied here.</span><button class="btn" data-dpppage="${DPP_TEXT.chart.page}">Open page ${DPP_TEXT.chart.page} of the original</button></div>
  <p class="note" style="margin-top:12px">Copied line by line from the official DPP (${esc(DPP_SOURCE.version)}), exactly as written, including its spelling. If anything differs, the original PDF is the reference.</p>`;
}

function splitNames(v){return up(v).split(/\s*\/\s*|\s*\n\s*|\s+&\s+/).map(n=>n.replace(/\.+$/,'').trim()).filter(Boolean)}

function findMonth(g){

  for(const row of g.slice(0,8))for(const v of row){const m=up(v).match(/\b(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER)\s+(20\d\d)\b/);if(m)return{year:+m[2],month:M.indexOf(m[1])+1}}

  const tl=Math.max(at(G,'TEAM LEADER'),at(Sb,'TEAM LEADER'));if(tl>=0)cols.push({c:tl,slot:'team_leader',pos:1});
  Sb.forEach((v,c)=>{if(v==='OT')cols.push({c,slot:'ot',pos:cols.filter(x=>x.slot==='ot').length+1})});
  const ae=findCol(G,v=>v.startsWith('ACCIDENT')||v==='A&E'||v==='A & E'),it=findCol(G,v=>v.startsWith('INTERN'));
  if(ae>=0){const end=it>ae?it:G.length;let p=0;for(let c=ae;c<end;c++)cols.push({c,slot:'ae',pos:++p})}
  if(it>=0)cols.push({c:it,slot:'interns',pos:1});
  for(const need of['cons_general','team_leader','ot','wards','ae'])if(!cols.some(x=>x.slot===need))warn.push({issue:'column_missing',detail:need});
  const ds=readDays(g,sr+1,dc,wc,ym,warn);
  for(const{r,iso}of ds)for(const k of cols){const raw=norm(g[r]?.[k.c]);if(!raw)continue;const ns=splitNames(raw);
    ns.forEach((n,i)=>out.push({date:iso,slot:k.slot,position:k.pos+i,raw:n,cell:cellRef(r,k.c)}));
    if(ns.length>1&&k.slot!=='ae')warn.push({cell:cellRef(r,k.c),issue:'multiple_names',detail:raw})}
  const by={};out.forEach(a=>{if(a.slot==='ae')(by[a.date]=by[a.date]||[]).push(a)});Object.values(by).forEach(a=>a.forEach((x,i)=>x.position=i+1));
  const last=ds.length?ds[ds.length-1].r:sr;
  return {month:ym,assignments:out,leave:parseFooterLeave(g.slice(last+1),ym,warn),warnings:warn};
}
function parseMorning(g){
  const warn=[],out=[],ym=findMonth(g);
  if(!ym)throw new Error('No month in the title rows');
  const hr=findRow(g,v=>v.startsWith('MORNING CALL'));if(hr<0)throw new Error('No "Morning Call" header');
  const H=g[hr].map(up),mc=findCol(H,v=>v.startsWith('MORNING CALL')),tr=findCol(H,v=>v.startsWith('TRAUMA')),sb=findCol(H,v=>v.startsWith('STANDBY'));
  for(const{r,iso}of readDays(g,hr+1,0,1,ym,warn)){
    const cell=c=>c<0?'':norm(g[r]?.[c]);
    if(cell(mc))out.push({date:iso,slot:'mc_junior',position:1,raw:splitNames(cell(mc))[0],cell:cellRef(r,mc)});
    if(cell(mc+1))out.push({date:iso,slot:'mc_senior',position:1,raw:splitNames(cell(mc+1))[0],cell:cellRef(r,mc+1)});
    // Trauma O.T.: one cell "A / B", or two cells side by side under a merged header.
    if(tr>=0){const tc=[];for(let c=tr;c<(sb>tr?sb:tr+1);c++)tc.push(c);let pos=0;const all=[];
      tc.forEach(c=>{if(cell(c))splitNames(cell(c)).forEach(n=>{all.push(n);out.push({date:iso,slot:'trauma_ot',position:++pos,raw:n,cell:cellRef(r,c)})})});
      if(all.length&&all.length!==2)warn.push({cell:cellRef(r,tr),issue:'trauma_not_a_pair',detail:all.join(' / ')})}
    if(sb>=0)for(let c=sb,p=1;c<sb+3;c++,p++)if(cell(c))out.push({date:iso,slot:'standby',position:p,raw:splitNames(cell(c))[0],cell:cellRef(r,c)});
  }
  return {month:ym,assignments:out,leave:[],warnings:warn};
}
function parseFooterLeave(rows,ym,warn){
  // Lines under the table containing "leave", e.g.
  //   "Consultants leaves:  Ali Redha: 27/9-6/10, Tariq: 4-17/10"   (name with a colon)
  //   "Consultants leaves: HASAN 19-26, ALI ZAIN 13-21"              (name without a colon)
  //   "Leaves; A.Aradi: 1-10 & 21-25, Tejani: 25-31 M.Emad: 18-19"   (missing comma is fine)
  const out=[];
  const text=rows.map(r=>r.map(norm).filter(Boolean).join(' ')).filter(t=>/leave/i.test(t));
  const D='\\d{1,2}(?:\\/\\d{1,2})?',R=`${D}(?:\\s*[-–]\\s*${D})?`;
  const re=new RegExp(`([A-Za-z][A-Za-z.' ]*?)\\s*:?\\s*(${R}(?:\\s*&\\s*${R})*)(?=\\s*(?:,|$|[A-Za-z]))`,'g');
  for(const line of text){
    const body=line.replace(/^.*?leaves?\s*[:;]\s*/i,'');
    let m;re.lastIndex=0;
    while((m=re.exec(body))){
      const name=up(m[1]);
      for(const part of m[2].split('&').map(s=>s.trim()).filter(Boolean)){
        const r=parseRange(part,ym);
        if(r)out.push({name,start:r[0],end:r[1]});else warn.push({issue:'leave_unreadable',detail:`${m[1].trim()}: ${part}`});
      }
    }
  }
  return out;
}
function parseRange(s,ym){
  const m=s.replace('–','-').match(/^(\d{1,2})(?:\/(\d{1,2}))?(?:\s*-\s*(\d{1,2})(?:\/(\d{1,2}))?)?$/);if(!m)return null;
  const endDay=m[3]?+m[3]:+m[1],em=m[4]?+m[4]:m[3]?ym.month:(m[2]?+m[2]:ym.month),sm=m[2]?+m[2]:em,y=mm=>mm>ym.month+6?ym.year-1:mm<ym.month-6?ym.year+1:ym.year;
  return [isoDate(y(sm),sm,+m[1]),isoDate(y(em),em,endDay)];
}

// ---------- Sheet tabs → the app's data ----------
const SLOT_K={cons_general:'cons',cons_spine:'cons',cons_pelvis:'cons',cons_paeds:'cons',cons_hipknee:'cons',cons_upperlimb:'cons',cons_foot:'cons',team_leader:'tl',ot:'ot',wards:'wards',ae:'ae',interns:'interns',mc_junior:'mcj',mc_senior:'mcs',trauma_ot:'tr',standby:'sb'};
const SLOT_IDX={cons_general:0,cons_spine:1,cons_pelvis:2,cons_paeds:3,cons_hipknee:4,cons_upperlimb:5,cons_foot:6,team_leader:7,wards:10,interns:15};
// Neurosurgery covering a column may be written NEURO or NS.
const NEURO_WORDS=['NS','NEURO','NEUROSURGERY','NEURO SURGERY'];
const SUB_KEYS=['gen','spine','pelvis','peds','hipknee','upper','foot'];
function buildData(p){
  const warnings=[];
  // Staff tab: Rota name | Full name | Grade | Firm | Status | Other spellings
  const staff=[],aliasMap={},firmLead=new Set(),firmOf={};
  (p.staff||[]).slice(1).forEach(r=>{
    const n=up(r[0]);if(!n||staff.some(s=>s.n===n))return;
    const gl=up(r[2]);
    const g=gl.startsWith('CONSULT')?'consultant':gl.startsWith('SENIOR')?'senior':gl.startsWith('JUNIOR')?'junior':gl.startsWith('ROTAT')?'rotator':gl.startsWith('INTERN')?'intern':'unconfirmed';
    staff.push({n,full:norm(r[1])||undefined,g,status:up(r[4])==='REMOVED'?'inactive':g==='rotator'?'rotating':'active'});
    String(r[5]||'').split(',').map(up).filter(a=>a&&a!==n).forEach(a=>{if(!aliasMap[a])aliasMap[a]=n});
    const f=norm(r[3]);if(f){const m=f.match(/^(.*?)\s*\(lead\)$/i);if(m)firmLead.add(up(m[1]));else firmOf[n]=up(f)}
  });
  const names=new Set(staff.map(s=>s.n));
  // A name that is someone else's spelling (e.g. merged duplicate) belongs to that person.
  const people=staff.filter(s=>!aliasMap[s.n]||!names.has(aliasMap[s.n]));
  const canon=n=>{n=up(n);return aliasMap[n]&&names.has(aliasMap[n])?aliasMap[n]:n};
  // Rota tabs
  const months={};
  (p.tabs||[]).forEach(t=>{
    const g=t.values||[];
    const isOC=g.some(r=>r.some(v=>up(v)==='CONSULTANTS')),isMO=!isOC&&g.some(r=>r.some(v=>up(v).startsWith('MORNING CALL')));
    if(!isOC&&!isMO)return;
    let res;try{res=isOC?parseOnCall(g):parseMorning(g)}catch(e){warnings.push({tab:t.name,issue:'unreadable',detail:e.message});return}
    const key=`${res.month.year}-${String(res.month.month).padStart(2,'0')}`,M=months[key]=months[key]||{};
    const part=isOC?'oc':'mo';
    if(M[part]){warnings.push({tab:t.name,issue:'duplicate_month',detail:`"${M[part+'Tab']}" already has ${key}; this tab was skipped`});return}
    M[part]=res;M[part+'Tab']=t.name;res.warnings.forEach(w=>warnings.push({tab:t.name,...w}));
  });
  const days=[],leave=[],unknown={},consCols={};
  Object.keys(months).sort().forEach(key=>{
    const M=months[key];
    if(!M.oc){warnings.push({tab:M.moTab,issue:'no_oncall_tab',detail:`No on-call tab for ${key}, so this month is not shown`});return}
    if(!M.oc.assignments.length){warnings.push({tab:M.ocTab,issue:'empty_month',detail:`${key} has no names yet, so it is not shown`});return}
    const [y,m]=key.split('-').map(Number),n=new Date(Date.UTC(y,m,0)).getUTCDate(),byDate={};
    for(let d=1;d<=n;d++){const iso=isoDate(y,m,d);byDate[iso]={d:iso,dow:dowOf(iso),oc:Array(16).fill(''),mo:['','',[],['','','']],cells:[]};days.push(byDate[iso])}
    const add=(a,tab,isOC)=>{const x=byDate[a.date];if(!x)return;const k=SLOT_K[a.slot];if(NEURO_WORDS.includes(a.raw))a.raw='NEURO';
      x.cells.push({k,n:a.raw,cell:`'${tab}'!${a.cell}`});
      if(a.raw!=='NEURO'&&a.raw!=='ROTATOR'&&!names.has(canon(a.raw)))(unknown[a.raw]=unknown[a.raw]||[]).push(`${tab}!${a.cell}`);
      if(isOC){let i=SLOT_IDX[a.slot];if(a.slot==='ot')i=a.position<=2?7+a.position:-1;if(a.slot==='ae')i=a.position<=4?10+a.position:-1;
        if(i>=0&&!x.oc[i])x.oc[i]=a.raw;
        if(k==='cons'&&i>0){const c=canon(a.raw);(consCols[c]=consCols[c]||{})[i]=(consCols[c][i]||0)+1}}
      else{if(a.slot==='mc_junior')x.mo[0]=a.raw;if(a.slot==='mc_senior')x.mo[1]=a.raw;if(a.slot==='trauma_ot')x.mo[2].push(a.raw);if(a.slot==='standby'&&a.position<=3)x.mo[3][a.position-1]=a.raw}};
    M.oc.assignments.forEach(a=>add(a,M.ocTab,true));
    if(M.mo)M.mo.assignments.forEach(a=>add(a,M.moTab,false));
    M.oc.leave.forEach(l=>leave.push({n:canon(l.name),s:l.start,e:l.end,kind:''}));
  });
  Object.entries(unknown).forEach(([n,cells])=>{people.push({n,g:'unconfirmed',status:'unknown'});warnings.push({issue:'unknown_name',detail:n,cells})});
  people.forEach(s=>{const c=consCols[s.n];if(s.g==='consultant'&&c){const best=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];s.sub=SUB_KEYS[+best[0]]}});
  const firms=[...new Set([...firmLead,...Object.values(firmOf)])].filter(l=>names.has(l)).map(lead=>({lead,term:'',members:people.filter(s=>firmOf[s.n]===lead&&s.status!=='inactive').map(s=>s.n)}));
  return {docs:p.docs||{},meta:{label:'',note:'',drafts:[]},staff:people,aliases:Object.entries(aliasMap),firms,days,leave,coordinators:COORDINATORS,warnings,at:p.at};
}

// ---------- talking to the Google Sheet ----------
async function apiGet(params){const r=await fetch(API+'?'+new URLSearchParams(params),{cache:'no-store'});const j=await r.json();if(j.error)throw new Error(j.error);return j}
async function apiPost(body){const r=await fetch(API,{method:'POST',body:JSON.stringify(body)});const j=await r.json();if(j.error)throw new Error(j.error);return j}
function readCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(e){return null}}
function writeCache(p){try{localStorage.setItem(CACHE_KEY,JSON.stringify(p))}catch(e){}}
const sig=p=>p?JSON.stringify([p.tabs,p.staff]):'';
async function fetchData(){const p=await apiGet({action:'data'});if(!p.tabs)throw new Error('Unexpected reply');writeCache(p);return p}
function bootMessage(title,body,retry){
  document.getElementById('main').innerHTML=`<div class="boot"><div class="mark">${''}</div><h1>${title}</h1><p class="note">${body}</p>${retry?'<button class="btn primary" onclick="location.reload()">Try again</button>':''}</div>`;
}
(async function boot(){
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(API)){bootMessage('Not connected yet','This copy of the app has no Google Sheet link. Put the Apps Script web-app link into <b>const API</b> at the top of the script.',false);return}
  const cached=readCache();
  if(cached){
    start(cached,{fromCache:true});
    fetchData().then(f=>{if(sig(f)!==sig(cached))window.dispatchEvent(new CustomEvent('rota-updated'))}).catch(()=>window.dispatchEvent(new CustomEvent('rota-offline')));
  }else{
    try{start(await fetchData(),{fromCache:false})}
    catch(e){bootMessage('Could not load the rota','Check your internet connection. ('+String(e.message||e).replace(/[<>&]/g,'')+')',true)}
  }
})();
function start(payload,opts){
  let D;try{D=buildData(payload)}catch(e){bootMessage('Could not read the rota','The Google Sheet layout was not recognised. ('+String(e.message||e).replace(/[<>&]/g,'')+')',true);return}
  if(!D.days.length){bootMessage('No rota yet','The Google Sheet has no month with names in it yet.',true);return}
  main(D,opts);
}
